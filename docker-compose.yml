services:
  db:
    image: postgres:16
    container_name: tileugabyl-laura-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: tileugabyl-laura-student-api
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/studentdb
      DB_USERNAME: student
      DB_PASSWORD: student123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
